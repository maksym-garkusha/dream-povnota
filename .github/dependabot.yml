# Щотижневі оновлення залежностей. Мажорні версії пакетів ASP.NET і образів .NET
# ідуть разом із новим .NET, тож їх переводимо вручну, а не окремими PR.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
