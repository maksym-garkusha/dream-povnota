name: site

# Щодня забирає змінені картки з API DREAM і перезбирає сторінку, data.json та звіт.
# Веб-сервіс сам підтягує опублікований data.json, тому тут немає ні бази, ні секретів.
on:
  schedule:
    # 03:17 UTC: 05:17 за Києвом узимку, 06:17 улітку
    - cron: '17 3 * * *'
  push:
    branches: [main]
    # зміни тільки веб-сервісу сторінку не перезбирають
    paths: ['src/**', '!src/DreamPovnota.Web/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # перший запуск без кешу качає всі картки: у 2 потоки з паузою це близько години
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # ключ має збігатися з ключем до перенесення коду в бібліотеку: hashFiles рахує вміст, а не шляхи
      - name: Show the cache key
        run: echo "dream-cards-${{ hashFiles('src/DreamPovnota.Core/Cards/**') }}"
      # кожен запуск бере кеш попереднього і зберігає свій: тоді качаються тільки змінені картки.
      # У кеші розібрані картки, тому ключ залежить від коду розбору: після його зміни
      # старий кеш не підходить і всі картки завантажуються заново
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: dream-cards-${{ hashFiles('src/DreamPovnota.Core/Cards/**') }}-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: dream-cards-${{ hashFiles('src/DreamPovnota.Core/Cards/**') }}-
      # 2 потоки з паузою між запитами (див. DreamClient.Pause): API державний і публічний
      - name: Sync cards with the API
        working-directory: src/DreamPovnota
        run: dotnet run -c Release -- sync --cache ../../data --parallel 2
      # кеш зберігаємо і тоді, коли sync відмовився публікувати неповні дані:
      # завантажене не пропаде, і наступний запуск докачає решту
      - uses: actions/cache/save@v6
        if: always() && hashFiles('data/projects.jsonl') != ''
        with:
          path: data
          key: dream-cards-${{ hashFiles('src/DreamPovnota.Core/Cards/**') }}-${{ github.run_number }}-${{ github.run_attempt }}
      - name: Export data for the page
        working-directory: src/DreamPovnota
        run: dotnet run -c Release --no-build -- export --cache ../../data ../../site
      - name: Write the report
        working-directory: src/DreamPovnota
        run: dotnet run -c Release --no-build -- report --cache ../../data ../../site/report.md
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
