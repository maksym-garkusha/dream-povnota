name: codeql

# Розширене налаштування CodeQL для C#: збираємо рішення самі, тож аналіз бачить
# той самий код, що й тести. Типове налаштування CodeQL у вкладці Security
# для цього репозиторію вмикати не треба, бо воно конфліктує з цим файлом.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # перший крок кожного job: журнал мережевих з'єднань і процесів раннера (StepSecurity, безкоштовно
      # для публічних репозиторіїв). Поки audit; коли список потрібних доменів устоїться, block
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - run: dotnet build -c Release
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:csharp
