name: codeql

# Розширене налаштування CodeQL для C#: збираємо рішення самі, тож аналіз бачить
# той самий код, що й тести. Типове налаштування CodeQL у вкладці Security
# для цього репозиторію вмикати не треба, бо воно конфліктує з цим файлом.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 2 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-and-quality
      - run: dotnet build -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
