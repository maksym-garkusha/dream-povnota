name: digest

# Щопонеділка збирає зріз для агентства й обласних служб відновлення: xlsx і PDF
# на кожну організацію з переліку. Файли лишаються артефактом запуску на 30 днів
# і на Pages не публікуються: зріз адресний, а не для всіх.
on:
  schedule:
    # 06:43 UTC у понеділок: після щоденного site.yml (03:17) і щогодинного імпорту на сервісі
    - cron: '43 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DATA_URL: https://maksym-garkusha.github.io/dream-povnota/data.json
  # звідси береться стан карток на початок тижня (історія живе в базі сервісу)
  SERVICE_URL: https://dream-povnota.onrender.com

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # перший крок кожного job: журнал мережевих з'єднань і процесів раннера (StepSecurity, безкоштовно
      # для публічних репозиторіїв). Поки audit; коли список потрібних доменів устоїться, block
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '11.0.x'
      - name: Download data.json
        run: curl -fsS --retry 3 -o data.json "$DATA_URL"
      # безкоштовний екземпляр спить і прокидається близько хвилини; якщо не прокинувся,
      # зріз однаково збирається, а у файлах сказано, що історії немає
      - name: Wake the service
        run: curl -fsS --max-time 100 --retry 2 --retry-delay 10 -o /dev/null "$SERVICE_URL/health/live" || echo "Сервіс не відповів"
      # зріз адресний, тож збирається лише з випуску, який прийняв запобіжник сервісу:
      # SHA-256 файлу з Pages має збігтися з /api/v1/meta. Поки сервіс щойно прокинувся
      # і ще завантажує випуск, meta відповідає 503, тому кілька спроб
      - name: Check that the service accepted this edition
        run: |
          expected=$(sha256sum data.json | cut -d' ' -f1)
          accepted=""
          for attempt in 1 2 3 4 5 6; do
            accepted=$(curl -fsS --max-time 60 "$SERVICE_URL/api/v1/meta" | jq -r '.edition.sha256 // empty') && [ -n "$accepted" ] && break
            sleep 20
          done
          echo "data.json з Pages:  $expected"
          echo "прийнятий сервісом: ${accepted:-немає відповіді}"
          if [ "$accepted" != "$expected" ]; then
            echo "::error::Сервіс не прийняв цей випуск data.json або ще не завантажив його. Причина в /health/ready, зріз не зібрано."
            exit 1
          fi
      - name: Build the digest
        working-directory: src/DreamPovnota
        run: dotnet run -c Release -- digest --edition ../../data.json --history "$SERVICE_URL" ../../digest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ github.run_number }}
          path: digest
          retention-days: 30
          if-no-files-found: error

  # атестація кожного файлу зрізу: служба, що отримала PDF чи xlsx, може перевірити, що його
  # зібрав цей workflow. Права на OIDC-токен і запис атестацій тільки в цьому job
  attest:
    needs: digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-${{ github.run_number }}
          path: digest
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: digest/*
